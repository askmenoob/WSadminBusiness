services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wsadmin_business
      POSTGRES_USER: wsadmin_business
      POSTGRES_PASSWORD: wsadmin_business_dev
    ports: ["55432:5432"]
    volumes: ["wsadmin_business_pg:/var/lib/postgresql/data"]
  redis:
    image: redis:8-alpine
    ports: ["56379:6379"]
volumes:
  wsadmin_business_pg:
